[client]
showErrorDetails = false
toolbarMode = "minimal"

[logger]
level = "warning"

[theme]
base = "light"
primaryColor = "#1f77b4"

[server]
maxUploadSize = 200
enableXsrfProtection = true
# Disable CORS to block cross-origin requests from other domains
enableCORS = false
# Run headless: don't expose local file paths or open a browser window
headless = true
# Disable file watcher in production (avoids leaking source paths)
fileWatcherType = "none"

[browser]
gatherUsageStats = false
