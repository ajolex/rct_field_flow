[client]
showErrorDetails = false
toolbarMode = "minimal"

[logger]
level = "warning"

[theme]
# base = "light"  # Commented out to enable user system/theme toggle

[server]
maxUploadSize = 200
enableXsrfProtection = true
# Disable CORS to block cross-origin requests from other domains
enableCORS = false
# Run headless: don't expose local file paths or open a browser window
headless = true
# Disable file watcher in production (avoids leaking source paths)
fileWatcherType = "none"

[browser]
gatherUsageStats = false
